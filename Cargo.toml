[package]
name = "mako"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "A desktop pet for KDE Plasma"

[dependencies]
ab_glyph = "0.2.29"
png = "0.17.16"
smithay-client-toolkit = { version = "=0.19.2", default-features = false }
tiny-skia = "0.11.4"
wayland-client = "=0.31.11"
x11rb = "=0.13.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[package]
name = "mako"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "A desktop pet for KDE Plasma"

[dependencies]
fastrand = "2"
# The tray, placement callback and file dialog share zbus's async-io backend.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "async-std"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg", "unstable-winit-030", "accessibility"] }
rustix = { version = "1", features = ["event"] }
libc = "0.2"
zbus = "6"
tempfile = "3"
png = "0.18.1"
smithay-client-toolkit = { version = "=0.20.0", default-features = false }
tiny-skia = "0.12.0"
wayland-client = "=0.31.15"
x11rb = { version = "=0.14.0", features = ["shape", "randr", "extra-traits"] }
zip = { version = "9.8", default-features = false, features = ["deflate"] }

ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = { version = "1.18", default-features = false, features = ["compat-1-18"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
